name: Build PSP Port

on:
  workflow_dispatch: # This adds the manual "Run workflow" button in your Actions tab

jobs:
  build-psp:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: psp-cmake -S psp -B psp/build

      - name: Compile PSP Port
        run: make -C psp/build -j$(nproc)

      - name: Upload EBOOT Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHAR-PSP-EBOOT
          path: psp/build/EBOOT/EBOOT.PBP
