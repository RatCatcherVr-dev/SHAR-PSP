name: Build PSP Port

on:
  workflow_dispatch:

jobs:
  build-psp:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix Case-Sensitivity Issues
        run: |
          # Find all occurrences of debugmessages.h (case-insensitive)
          find . -iname "debugmessages.h" | while read -r FILE_PATH; do
            DIR_PATH=$(dirname "$FILE_PATH")
            PARENT_DIR=$(dirname "$DIR_PATH")
            DIR_NAME=$(basename "$DIR_PATH")
            FILE_NAME=$(basename "$FILE_PATH")
            
            # Convert directory name to lowercase to check if it matches 'utility'
            LOWER_DIR_NAME=$(echo "$DIR_NAME" | tr '[:upper:]' '[:lower:]')
            
            # 1. Fix file casing if needed (e.g., DebugMessages.h -> debugmessages.h)
            if [ "$FILE_NAME" != "debugmessages.h" ]; then
              echo "Creating file symlink: $DIR_PATH/debugmessages.h -> $FILE_NAME"
              (cd "$DIR_PATH" && ln -sf "$FILE_NAME" debugmessages.h)
            fi
            
            # 2. Fix local directory casing if needed (e.g., Utility -> utility)
            if [ "$LOWER_DIR_NAME" = "utility" ] && [ "$DIR_NAME" != "utility" ]; then
              echo "Creating local directory symlink in $PARENT_DIR: utility -> $DIR_NAME"
              (cd "$PARENT_DIR" && ln -sf "$DIR_NAME" utility)
            fi
            
            # 3. Create a global symlink under 'src' as a fallback for -Isrc/
            if [ -d "${GITHUB_WORKSPACE}/src" ]; then
              echo "Creating global fallback symlink in src/ -> $DIR_PATH"
              ABS_DIR_PATH=$(realpath "$DIR_PATH")
              ln -sf "$ABS_DIR_PATH" "${GITHUB_WORKSPACE}/src/utility"
            fi
          done

      - name: Configure CMake
        run: |
          psp-cmake -S psp -B psp/build \
            -DCMAKE_C_FLAGS="-w -I${GITHUB_WORKSPACE}/src" \
            -DCMAKE_CXX_FLAGS="-w -I${GITHUB_WORKSPACE}/src"

      - name: Compile PSP Port
        run: make -C psp/build

      - name: Upload EBOOT Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHAR-PSP-EBOOT
          path: psp/build/EBOOT/EBOOT.PBP
