name: Build PSP Port

on:
  workflow_dispatch:

jobs:
  build-psp:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix Case-Sensitivity Issues
        run: |
          # Automatically find the directory that contains debugmessages.h
          # and create a symlink to fix the case-sensitivity mismatch
          FILE_PATH=$(find . -name "debugmessages.h" | head -n 1)
          if [ -n "$FILE_PATH" ]; then
            DIR_PATH=$(dirname "$FILE_PATH")
            PARENT_DIR=$(dirname "$DIR_PATH")
            # Create a symlink named 'utility' pointing to the actual folder found
            # This ensures that #include "utility/..." always works
            cd "$PARENT_DIR"
            ln -s *utility* utility 2>/dev/null || true
          fi

      - name: Configure CMake
        run: |
          psp-cmake -S psp -B psp/build \
            -DCMAKE_C_FLAGS="-w -I${GITHUB_WORKSPACE}/src" \
            -DCMAKE_CXX_FLAGS="-w -I${GITHUB_WORKSPACE}/src"

      - name: Compile PSP Port
        run: make -C psp/build

      - name: Upload EBOOT Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHAR-PSP-EBOOT
          path: psp/build/EBOOT/EBOOT.PBP
