name: Build PSP Port

on:
  workflow_dispatch:

jobs:
  build-psp:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix Case-Sensitivity Issues (Global Patcher)
        run: |
          echo "=== Patching Directory Casing ==="
          # Find all directories containing uppercase letters and create lowercase symlinks for them
          find . -type d -not -path '*/.*' -not -path '.' | while read -r DIR; do
            PARENT=$(dirname "$DIR")
            NAME=$(basename "$DIR")
            LOWER_NAME=$(echo "$NAME" | tr '[:upper:]' '[:lower:]')
            if [ "$NAME" != "$LOWER_NAME" ]; then
              echo "Symlinking directory: $PARENT/$LOWER_NAME -> $NAME"
              (cd "$PARENT" && ln -sf "$NAME" "$LOWER_NAME")
            fi
          done

          echo "=== Patching Header File Casing ==="
          # Find all .h/.hpp files containing uppercase letters and create lowercase symlinks for them
          find . -type f \( -name "*.h" -o -name "*.hpp" \) -not -path '*/.*' | while read -r FILE; do
            DIR=$(dirname "$FILE")
            NAME=$(basename "$FILE")
            LOWER_NAME=$(echo "$NAME" | tr '[:upper:]' '[:lower:]')
            if [ "$NAME" != "$LOWER_NAME" ]; then
              echo "Symlinking header: $DIR/$LOWER_NAME -> $NAME"
              (cd "$DIR" && ln -sf "$NAME" "$LOWER_NAME")
            fi
          done

      - name: Configure CMake
        run: |
          psp-cmake -S psp -B psp/build \
            -DCMAKE_C_FLAGS="-w -I${GITHUB_WORKSPACE}/src" \
            -DCMAKE_CXX_FLAGS="-w -I${GITHUB_WORKSPACE}/src"

      - name: Compile PSP Port
        run: make -C psp/build

      - name: Upload EBOOT Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHAR-PSP-EBOOT
          path: psp/build/EBOOT/EBOOT.PBP
