name: Build PSP Port

on:
  workflow_dispatch:

jobs:
  build-psp:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure CMake
        run: |
          psp-cmake -S psp -B psp/build \
            -DCMAKE_C_FLAGS="-w -I${GITHUB_WORKSPACE}/src -I${GITHUB_WORKSPACE}/src/libs/radcore/include -I${GITHUB_WORKSPACE}/src/libs/radcore/inc" \
            -DCMAKE_CXX_FLAGS="-w -I${GITHUB_WORKSPACE}/src -I${GITHUB_WORKSPACE}/src/libs/radcore/include -I${GITHUB_WORKSPACE}/src/libs/radcore/inc"

      - name: Compile PSP Port
        run: make -C psp/build

      - name: Upload EBOOT Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHAR-PSP-EBOOT
          path: psp/build/EBOOT/EBOOT.PBP
