name: Build PSP Port

on:
  workflow_dispatch:

jobs:
  build-psp:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure CMake
        run: |
          # Automatically find the path to the utility headers
          RADCORE_PATH=$(find ${GITHUB_WORKSPACE}/src -name "radcore" -type d | head -n 1)
          
          psp-cmake -S psp -B psp/build \
            -DCMAKE_C_FLAGS="-w -I${GITHUB_WORKSPACE}/src -I${RADCORE_PATH}/inc -I${RADCORE_PATH}/include" \
            -DCMAKE_CXX_FLAGS="-w -I${GITHUB_WORKSPACE}/src -I${RADCORE_PATH}/inc -I${RADCORE_PATH}/include"

      - name: Compile PSP Port
        run: make -C psp/build

      - name: Upload EBOOT Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHAR-PSP-EBOOT
          path: psp/build/EBOOT/EBOOT.PBP
